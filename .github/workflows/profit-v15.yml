name: LONG AI PROFIT v1.5 C research checks
on:
  push:
    branches: [feat/long-ai-profit-v1-5-c-clean-exit-20261029]
  pull_request:
    paths:
      - 'pine/LONG_AI_PROFIT_v1_5_C_LAB.pine'
      - 'test/pine-v15-safety.test.js'
      - '.github/workflows/profit-v15.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static v1.5 Pine checks (NOT compiler evidence)
        run: node --test test/pine-v15-safety.test.js
      - name: Existing JS and OHLCV regressions
        run: node --test test/trend-pullback-v11.test.js test/pine-v12-safety.test.js test/profit-signals.test.js test/profit-simulator.test.js test/pine-v6627-parity.test.js test/stock-rth-rebuild.test.js test/minute-parity.test.js test/crypto-parity.test.js
