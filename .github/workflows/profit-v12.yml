name: LONG AI PROFIT v1.2 isolated validation
on:
  push:
    branches:
      - feat/long-ai-profit-v1-2-execution-20261029
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test v1.2 and all existing 1H/4H execution invariants
        run: node --test test/pine-v12-safety.test.js test/trend-pullback-v11.test.js test/profit-signals.test.js test/profit-simulator.test.js test/pine-v6627-parity.test.js test/stock-rth-rebuild.test.js test/minute-parity.test.js test/crypto-parity.test.js
      - name: Locked older-window validation 2024-09 to 2025-02 (before 2025 v1.1 window)
        timeout-minutes: 15
        env:
          PROFIT_FROM: 2024-09-01T00:00:00Z
          PROFIT_TO: 2025-03-01T00:00:00Z
        run: node scripts/run-profit-universe.mjs
