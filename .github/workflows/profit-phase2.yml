name: Phase 2 PROFIT simulator checks
on:
  push:
    branches:
      - feat/long-ai-profit-phase2-20261028
  pull_request:
    paths:
      - 'lib/profit-simulator.js'
      - 'lib/profit-signals.js'
      - 'scripts/run-profit-lab.mjs'
      - 'test/profit-simulator.test.js'
      - 'test/profit-signals.test.js'
      - 'pine/LONG_AI_PROFIT_v1_0_LAB.pine'
      - '.github/workflows/profit-phase2.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/profit-signals.test.js test/profit-simulator.test.js test/pine-v6627-parity.test.js test/minute-parity.test.js test/crypto-parity.test.js
      - name: Real BTC historical feasibility (does not place orders)
        timeout-minutes: 6
        run: node scripts/run-profit-lab.mjs
