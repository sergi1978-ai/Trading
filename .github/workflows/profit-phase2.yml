name: Phase 2 PROFIT simulator checks
on:
  push:
    branches:
      - feat/long-ai-profit-phase2-20261028
  pull_request:
    paths:
      - 'lib/profit-simulator.js'
      - 'lib/profit-readiness.js'
      - 'lib/profit-signals.js'
      - 'scripts/run-profit-lab.mjs'
      - 'scripts/run-profit-universe.mjs'
      - 'test/profit-simulator.test.js'
      - 'test/profit-readiness.test.js'
      - 'test/profit-signals.test.js'
      - 'pine/LONG_AI_PROFIT_v1_0_LAB.pine'
      - '.github/workflows/profit-phase2.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/profit-readiness.test.js test/profit-signals.test.js test/profit-simulator.test.js test/pine-v6627-parity.test.js test/minute-parity.test.js test/crypto-parity.test.js
      - name: Real BTC historical feasibility (does not place orders)
        timeout-minutes: 6
        run: node scripts/run-profit-lab.mjs
      - name: Fixed six-asset Coinbase audit (read-only)
        timeout-minutes: 10
        run: node scripts/run-profit-universe.mjs
      - name: Independent historical market-regime check, Jan-Apr 2026 (read-only)
        timeout-minutes: 10
        env:
          PROFIT_FROM: 2026-01-01T00:00:00Z
          PROFIT_TO: 2026-05-01T00:00:00Z
        run: node scripts/run-profit-universe.mjs
