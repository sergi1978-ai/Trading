name: LONG AI PROFIT v1.1 parity and locked comparison
on:
  push:
    branches:
      - feat/long-ai-profit-v1-1-parity-20261028
  pull_request:
    paths:
      - 'lib/trend-pullback-v11.js'
      - 'lib/stock-rth-rebuild.js'
      - 'test/trend-pullback-v11.test.js'
      - 'test/stock-rth-rebuild.test.js'
      - 'scripts/run-profit-universe.mjs'
      - 'pine/LONG_AI_PROFIT_v1_1_A_LAB.pine'
      - '.github/workflows/profit-v11.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test new strategy and existing simulation invariants
        run: node --test test/stock-rth-rebuild.test.js test/trend-pullback-v11.test.js test/profit-signals.test.js test/profit-simulator.test.js test/pine-v6627-parity.test.js test/minute-parity.test.js test/crypto-parity.test.js
      - name: Historical Coinbase Mar-Sep 2025 comparison (same fixed six markets)
        timeout-minutes: 11
        env:
          PROFIT_FROM: 2025-03-01T00:00:00Z
          PROFIT_TO: 2025-10-01T00:00:00Z
        run: node scripts/run-profit-universe.mjs
